<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Busca CEP</title>
</head>
<body>
    
    <main class="container">
        <h1>Rastreador de Lares</h1>

        <form id="form-cep">
            <input type="text" id="input-cep" placeholder="Digite o CEP(somente números)" maxlength="8" pattern="\d{8}" required>
            <!--maxlenght="" limita a digitação de caracteres
            pattern="\d{8}" define que o campo deve possuir exatamente 8 números
            -->

        <button type="submit">Buscar</button>


        </form>
        <div id="resultado" class="resultado"></div>



    </main>







    <script src="./main.js"></script>
</body>
</html>
